<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: #111827; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    
    .header { padding: 15px 20px; background: #1f2937; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #374151; }
    .header img { height: 40px; }
    
    .player-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .video-wrapper { width: 100%; max-width: 1200px; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    iframe, video { width: 100%; height: 100%; border: none; object-fit: contain; }
    
    .message-box { text-align: center; padding: 40px; background: #1f2937; border-radius: 10px; max-width: 500px; border: 1px solid #374151; }
    .message-box h2 { margin-bottom: 10px; color: #f87171; }
    .message-box p { color: #9ca3af; }
    
    .controls { padding: 15px; background: #1f2937; text-align: center; border-top: 1px solid #374151; display: flex; gap: 10px; justify-content: center; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; background: #2563eb; color: white; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .btn:hover { background: #1d4ed8; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div class="header">
  <img src="https://res.cloudinary.com/dv8uywtbo/image/upload/yashintv_main_xtgfdr.png" alt="Logo">
</div>

<div class="player-container" id="mainContainer">
  <div class="message-box" id="msgBox">
    <h2>Loading Stream...</h2>
    <p>Please wait while we connect to the server.</p>
  </div>
</div>

<div class="controls">
  <a href="#" id="backBtn" class="btn" style="background:#4b5563;">← Back to Match</a>
  <button class="btn" onclick="window.location.reload()">Reload Player</button>
</div>

<script>
  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  const matchId = getParam('match');
  const linkId = getParam('id');
  const mainContainer = document.getElementById('mainContainer');
  
  // Set back button to match details
  document.getElementById('backBtn').href = `https://www.yashintv.xyz/p/match-details.html?id=${matchId}`;

  if (!matchId || !linkId) {
    showError("Invalid Link", "Missing match ID or link ID.");
  } else {
    fetch('https://football-feed.pages.dev/links.json?t=' + Date.now())
      .then(res => res.json())
      .then(data => {
        const matchData = data[matchId];
        
        if (!matchData) {
            showError("Not Found", "This match is not in the database yet.");
            return;
        }

        // Get specific link or fallback to common
        let linkObj = matchData[`link${linkId}`];
        if (!linkObj || !linkObj.url) {
            linkObj = matchData.common;
        }

        if (!linkObj || !linkObj.url) {
            showError("Stream Unavailable", "The link for this stream has not been added yet. Please check back later.");
            return;
        }

        const url = linkObj.url;
        const type = linkObj.type || 'redirect';

        if (type === 'redirect') {
            window.location.href = url;
        } else if (type === 'iframe') {
            mainContainer.innerHTML = `<div class="video-wrapper"><iframe src="${url}" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>`;
        } else if (type === 'hls') {
            mainContainer.innerHTML = `<div class="video-wrapper"><video id="videoEl" controls autoplay playsinline></video></div>`;
            const video = document.getElementById('videoEl');
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
            }
        }
      })
      .catch(err => {
        showError("Error", "Failed to load database.");
      });
  }

  function showError(title, message) {
    mainContainer.innerHTML = `
      <div class="message-box">
        <h2>${title}</h2>
        <p>${message}</p>
      </div>
    `;
  }
</script>

</body>
</html>
